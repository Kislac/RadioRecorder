  <text x="1290" y="507" class="small">Nagy impedancias mero</text>
  <circle cx="440" cy="560" r="5" class="dot"/>
  <circle cx="700" cy="560" r="5" class="dot"/>
  <circle cx="1240" cy="560" r="5" class="dot"/>
  <path class="wire" d="M930 560 V585 M910 585 H950 M918 596 H942 M925 607 H935"/>
  <text x="960" y="608" class="label">ESP GND</text>
  <text x="65" y="548" class="small">ESP GND / mero referencia</text>

  <text x="65" y="653" class="note">D csak meropont. Ne kosd a radio MIC-hez vagy foldjehez; a 470 Ω-os telefonkabel nem alkalmas ide.</text>
