<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hardver teszt - Radio Recorder</title>
    <link rel="stylesheet" href="/settings.css" />
  </head>
  <body>
    <header>
      RADIO RECORDER
      <nav><a href="/">Főoldal</a> · <a href="/settings">Beállítások</a></nav>
    </header>
    <main>
      <h1>Hardver teszt</h1>
      <section class="ptt-test">
        <h2>PTT relé</h2>
        <p>Csak leválasztott rádióval, ellenőrzött GPIO10 és aktív alacsony relémodullal. Az impulzus 1 másodpercig tart; a kapcsoló bekapcsolva marad, amíg ki nem kapcsolod.</p>
        <p id="pttStatus" role="status" aria-live="polite">Állapot betöltése...</p>
        <div class="ptt-actions">
          <button id="pttOn" type="button" disabled>1 mp tesztimpulzus</button>
          <button id="pttToggle" type="button" aria-pressed="false" disabled>Relé bekapcsolása</button>
          <button id="pttOff" type="button">Azonnali kikapcsolás</button>
        </div>
      </section>
    </main>
    <footer>ESP32-S3 / Radio Recorder</footer>
    <script src="/test.js"></script>
  </body>
</html>
