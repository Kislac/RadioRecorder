<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DAC test - Radio Recorder</title>
    <link rel="stylesheet" href="/settings.css" />
    <link rel="stylesheet" href="/dac_test.css" />
    <link rel="stylesheet" href="/station.css" />
  </head>
  <body>
    <header><a class="site-brand" href="/"><img src="/logo.svg" alt="" /><span>RADIORECORDER<small>CLEAR SKY / SIGNAL STATION</small></span></a><nav aria-label="Pages"><a href="/">Recording</a><a href="/files">File manager</a><a href="/settings#autoSettings">Automatic settings</a><a href="/settings">Settings</a><a href="/radio">Radio Programming</a><a href="/test">Hardware tests</a><a href="/dac-test" aria-current="page">DAC test</a></nav></header>
    <main>
      <h1>DAC test</h1>
      <form id="toneForm">
        <div class="setting"><label for="frequency">Tone frequency</label><select name="frequency" id="frequency"><option value="400">400 Hz</option><option value="1000" selected>1 kHz</option><option value="2000">2 kHz</option></select></div>
        <div class="setting"><label for="rate">Sample rate</label><select name="rate" id="rate"><option value="22050">22 050 Hz</option><option value="44100" selected>44 100 Hz</option><option value="48000">48 000 Hz</option></select></div>
        <div class="setting"><label for="bits">Sample size</label><select name="bits" id="bits"><option value="16" selected>16 bit</option><option value="32">32 bit</option></select></div>
        <div class="setting"><label for="format">I²S format</label><select name="format" id="format"><option value="philips" selected>Philips I²S</option><option value="msb">MSB / left justified</option></select></div>
        <div class="setting"><label for="level">Signal level</label><select name="level" id="level"><option value="20">20%</option><option value="50" selected>50%</option><option value="90">90%</option></select></div>
        <div class="actions"><button id="startTone" type="submit" disabled>Start 10-second tone</button><button id="stopTone" type="button" disabled>Stop</button></div>
      </form>
      <p id="toneStatus" role="status" aria-live="polite">Loading status...</p>
      <progress id="toneProgress" max="100" value="0" aria-label="Tone progress"></progress>
    </main>
    <nav class="bottom-nav" aria-label="Main views"><a href="/"><span aria-hidden="true">&#9673;</span>Recording</a><a href="/settings#autoSettings"><span aria-hidden="true">&#9678;</span>Auto settings</a><a href="/files"><span aria-hidden="true">&#9636;</span>Files</a><a href="/settings"><span aria-hidden="true">&#9881;</span>System</a><details class="more-menu"><summary aria-current="page"><span aria-hidden="true">&#8943;</span>More</summary><div><a href="/radio">Radio Programming</a><a href="/test">Hardware tests</a><a href="/dac-test" aria-current="page">DAC test</a></div></details></nav>
    <footer>ESP32-S3 / Radio Recorder</footer>
    <script src="/dac_test.js"></script>
  </body>
</html>
